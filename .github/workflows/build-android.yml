name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner already carries an Android SDK; this only puts the command line tools
      # on the path. The action's default package list still asks for "tools", which no
      # longer exists, so nothing is installed here and Gradle fetches what it needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install dependencies
        run: npm ci

      # The web side of the app is app/ itself, so there is nothing to compile:
      # the sync copies it into the Android project and refreshes the plugin list.
      - name: Copy the web app into the Android project
        run: npm run android:sync

      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Name the APK after the version
        id: name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/GeneCanvas-$VERSION.apk"
          echo "apk=out/GeneCanvas-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: GeneCanvas-android
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
