<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GeneCanvas</title>
<!-- the window is the device's own width on a phone; on the desktop this changes nothing -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- connect-src is for the Android build, which talks to NCBI from the page itself;
     the desktop build asks its main process instead and never uses it -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self' https://eutils.ncbi.nlm.nih.gov">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="win" id="win">
  <div class="menubar" id="menubar"></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="doctabs" id="doctabs"></div>
  <div class="main">
    <aside class="side" id="side"></aside>
    <section class="view" id="view"></section>
    <div class="splitter" id="splitter" hidden></div>
    <section class="view companion" id="view2" hidden></section>
    <aside class="infopanel" id="infopanel" hidden></aside>
  </div>
  <div class="viewtabs" id="viewtabs"></div>
  <div class="status" id="status"></div>
</div>
<div class="modal-bg" id="modal" hidden><div class="dlg" id="dlg"></div></div>
<div class="menu-pop" id="menupop" hidden></div>
<div class="menu-pop" id="menusub" hidden></div>
<div class="ctx" id="ctx" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileinput" hidden accept=".gb,.gbk,.genbank,.gbff,.ape,.fa,.fasta,.fna,.txt,.seq,.dna,.ab1">
<script src="dna.js"></script>
<script src="clone.js"></script>
<script src="trace.js"></script>
<script src="primer.js"></script>
<script src="msa.js"></script>
<script src="codon-tables.js"></script>
<script src="codon.js"></script>
<script src="struct.js"></script>
<script src="silent.js"></script>
<script src="search.js"></script>
<script src="gel.js"></script>
<script src="assembly.js"></script>
<script src="asmui.js"></script>
<script src="toolui.js"></script>
<script src="simui.js"></script>
<script src="mobileboot.js"></script>
<script src="app.js"></script>
<script src="touch.js"></script>
</body>
</html>
